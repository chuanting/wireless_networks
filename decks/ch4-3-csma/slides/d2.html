<section id="d2" data-transition="fade" style="background:#15171A;color:#F2F0EB;font-family:'Noto Sans SC', sans-serif;padding:96px 128px;display:flex;flex-direction:column;justify-content:flex-end;gap:26px"><p style="position:absolute;left:96px;top:40px;width:1100px;font-size:420px;font-weight:900;line-height:1;text-align:left;color:#D9411B;letter-spacing:-16px">02</p><p style="font-size:28px;font-weight:700;line-height:1.3;color:#8D9299;letter-spacing:6px">第二部分</p><h1 style="font-size:104px;font-weight:900;line-height:1.1;color:#F2F0EB">非时隙 CSMA 的通过率</h1><p style="font-size:34px;font-weight:400;line-height:1.4;color:#C9CCD1;">把时间切成“空闲期 + 忙期”的周期，就能算出通过率。</p><div style="display:flex;gap:28px;align-items:flex-start;padding-top:28px"><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">01</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">忙闲周期</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">02</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">推导通过率</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">03</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">检查公式</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">04</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">与 ALOHA 比较</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">05</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">坚持还是不坚持</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">06</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;"><i>β</i> 的影响</p></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;border-top:2px solid #3A3E44;padding-top:12px"><p style="font-size:24px;font-weight:900;line-height:1.2;color:#D9411B;">07</p><p style="font-size:26px;font-weight:400;line-height:1.35;color:#C9CCD1;">小结</p></div></div><aside>【过渡】
第二部分，算非坚持 CSMA 的通过率。方法和 ALOHA 不同：信道一段忙、一段闲，交替出现，我们把一个“忙 + 闲”当作一个周期来算。</aside></section>
