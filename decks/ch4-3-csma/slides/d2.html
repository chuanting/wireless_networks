<section id="d2" data-transition="fade" style="background:#F6F1E7;color:#1E1A16;font-family:'Noto Sans SC', sans-serif;padding:128px 128px 112px;display:flex;flex-direction:column;justify-content:flex-end;gap:26px"><p style="position:absolute;left:900px;top:70px;width:892px;font-family:'Noto Serif SC', serif;font-size:400px;font-weight:900;line-height:1;text-align:right;color:#E6DCCA;">02</p><div style="width:160px;height:10px;background:#B4381F"></div><p style="font-size:30px;font-weight:700;line-height:1.3;color:#5E554B;letter-spacing:8px">第二部分</p><h1 style="font-family:'Noto Serif SC', serif;font-size:100px;font-weight:900;line-height:1.12;color:#1E1A16">非时隙 CSMA 的通过率</h1><p style="font-family:'Noto Serif SC', serif;font-size:34px;font-weight:400;line-height:1.5;color:#5E554B;">把时间切成“空闲期 + 忙期”的周期，就能算出通过率。</p><div style="padding-top:20px"><div style="display:flex;gap:72px;align-items:flex-start;"><div style="display:flex;flex-direction:column;gap:0px;flex:1"><div style="display:flex;align-items:baseline;gap:16px;border-top:1px solid #CFC5B4;padding:12px 0px"><p style="font-family:'Noto Serif SC', serif;font-size:30px;font-weight:900;line-height:1.2;color:#B4381F;width:64px">01</p><p style="font-size:30px;font-weight:400;line-height:1.4;color:#1E1A16;">忙闲周期</p></div><div style="display:flex;align-items:baseline;gap:16px;border-top:1px solid #CFC5B4;padding:12px 0px"><p style="font-family:'Noto Serif SC', serif;font-size:30px;font-weight:900;line-height:1.2;color:#B4381F;width:64px">02</p><p style="font-size:30px;font-weight:400;line-height:1.4;color:#1E1A16;">推导通过率</p></div><div style="display:flex;align-items:baseline;gap:16px;border-top:1px solid #CFC5B4;padding:12px 0px"><p style="font-family:'Noto Serif SC', serif;font-size:30px;font-weight:900;line-height:1.2;color:#B4381F;width:64px">03</p><p style="font-size:30px;font-weight:400;line-height:1.4;color:#1E1A16;">检查公式</p></div><div style="display:flex;align-items:baseline;gap:16px;border-top:1px solid #CFC5B4;p
