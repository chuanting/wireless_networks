ht:400;line-height:1.5;color:#1E1A16;flex:1">网络与它的用户之间的速率匹配。</p></div></div><div style="flex:1;min-height:32px"></div><p style="font-family:'Noto Sans SC', sans-serif;font-size:36px;font-weight:400;line-height:1.55;color:#1E1A16">这些目标之间有矛盾：吞吐量和公平，吞吐量和时延。</p><aside>【2 分钟】
流量控制和拥塞控制的目标，参考课件列了五条：网络的吞吐量最大化；降低时延；避免死锁；兼顾公平，在用户之间合理地分配资源；网络和它的用户之间速率匹配。
这些目标不是都能同时达到的。后面两页各看一个矛盾：公平会不会损失吞吐量？吞吐量越高，时延是不是越大？</aside></section>
