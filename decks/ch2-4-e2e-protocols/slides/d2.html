<h1 style="font-size:96px;font-weight:700;line-height:1.1;color:#F4F1E8">运输层：TCP</h1>
<p style="font-size:40px;color:#B9C4D3">端口 · 握手与挥手 · 可靠传输 · 重传定时器 · 流量控制</p>
<aside>【约 0.3 分钟】
第二部分：运输层，重点是 TCP。TCP 是互联网上用得最多的可靠传输协议，网页、邮件、文件传输都靠它。它把第一部分的思想——编号、确认、窗口、超时重传、初始化——全都用上了，而且做了很多精巧的改进。</aside>
