<h1 style="font-size:96px;font-weight:700;line-height:1.1;color:#F4F1E8">面向字符的组帧</h1>
<p style="font-size:40px;color:#B9C4D3">异步串口 · 转义 · SLIP · PPP</p>
<p style="font-size:28px;font-weight:700;color:#F4975A">约 28 分钟</p>
<aside>【约 0.2 分钟】
第二部分：面向字符的组帧。“字符”在这里就是“字节”——处理的基本单位是一个字节（8 个比特）。路标是特殊的字节，数据里撞上了就用“转义字节”来处理。我们先学一点十六进制，然后从最简单的串口开始，一步一步走到真正的协议 SLIP 和 PPP。</aside>
