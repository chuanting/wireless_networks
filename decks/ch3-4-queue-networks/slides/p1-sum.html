第一部分小结，三句话：
串联：节点 2 的到达就是节点 1 的离开，两个队列不再独立。
难点一：分组长度在每个链路上都一样，到达间隔和服务时间相关。
难点二：输出过程未必是泊松。M/D/1 的输出不是；但 M/M/1 的是——这是 Burke 定理。
