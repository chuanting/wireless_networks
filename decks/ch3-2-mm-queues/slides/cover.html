本讲从零解释一个排队系统，不要求学生先会泊松过程、生灭链或 Little 定理。先看实际过程，再为过程取数学名字。
主线只有一个问题：每秒平均来4个分组，服务员忙时平均能处理5个，为什么还会等待、平均等多久？全程使用这组参数，把符号、状态概率和时延对应起来。
核心路线讲透M/M/1，后面的有限容量、多服务员及爱尔兰公式是拓展，使用“只讲核心”可跳过。先让学生说出生活中的排队经历。</aside></section>
