<aside>【1 分钟】
第三部分小结，三句话：
结构：令牌或者轮询信号，依次访问 m 个用户；站间有走时 V。
三种规则：耗尽型，发完才走；闸门型，只发到达时已有的；限制型，每次只发一个。
结论：耗尽型最好；轻载时，平均等待大约是半个循环；限制型的稳定条件更严，要 ρ 加 λE[V] 小于 1。
